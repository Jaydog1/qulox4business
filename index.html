<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qulox Business - Business Social Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <style>
      :root {
        --bg: #07111d;
        --bg-soft: #0d1a2b;
        --panel: rgba(255, 255, 255, 0.06);
        --panel-border: rgba(255, 255, 255, 0.08);
        --card: #ffffff;
        --text: #0d1b2a;
        --muted: #5a6475;
        --primary: #2d6df6;
        --primary-2: #11a0ff;
        --primary-3: #7c4dff;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        font-family: "Inter", sans-serif;
        background: linear-gradient(135deg, #0b1522, #0d1d2d 40%, #1b2b45);
        color: var(--text);
      }

      body {
        min-height: 100vh;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button, input {
        font: inherit;
      }

      .page-shell {
        min-height: 100vh;
        padding: 20px 30px 60px;
      }

      .topbar {
        max-width: 1280px;
        margin: 0 auto 28px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--panel-border);
        box-shadow: 0 18px 40px rgba(11, 19, 35, 0.22);
        border-radius: 18px;
        padding: 16px 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        backdrop-filter: blur(10px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: white;
        font-weight: 700;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--primary), var(--primary-3));
        color: white;
        font-weight: 800;
      }

      .topnav {
        display: flex;
        align-items: center;
        gap: 26px;
        color: rgba(255,255,255,0.82);
        font-size: 0.95rem;
      }

      .topnav a:hover {
        color: white;
      }

      .primary-button {
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: white;
        font-weight: 700;
        padding: 0.8rem 1.25rem;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 10px 20px rgba(45, 109, 246, 0.28);
      }

      .primary-button:hover {
        transform: translateY(-1px);
      }

      .primary-button.wide {
        width: 100%;
        margin-top: 8px;
      }

      .app {
        max-width: 1280px;
        margin: 0 auto;
        min-height: 720px;
      }

      .login-panel {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 30px;
        align-items: center;
        min-height: 720px;
      }

      .login-card {
        background: rgba(255,255,255,0.93);
        border: 1px solid rgba(255,255,255,0.04);
        border-radius: 28px;
        box-shadow: 0 18px 40px rgba(11, 19, 35, 0.22);
        padding: 36px 32px;
        max-width: 560px;
        width: 100%;
        margin: 0 auto;
      }

      .logo-circle {
        width: 70px;
        height: 70px;
        border-radius: 20px;
        background: linear-gradient(135deg, var(--primary), var(--primary-3));
        display: grid;
        place-items: center;
        color: white;
        font-size: 2rem;
        font-weight: 800;
        margin: 0 auto 8px;
      }

      .login-card h1 {
        margin: 10px 0 8px;
        text-align: center;
        font-size: 2.7rem;
        line-height: 1.1;
        color: var(--text);
      }

      .login-card p {
        text-align: center;
        color: var(--muted);
        margin: 0 0 24px;
      }

      .field {
        display: block;
        margin-bottom: 18px;
      }

      .field span {
        display: block;
        font-size: 0.9rem;
        margin-bottom: 8px;
        font-weight: 600;
        color: #23354d;
      }

      .field input {
        width: 100%;
        height: 52px;
        border-radius: 12px;
        border: 1px solid #dfe5ef;
        padding: 0 14px;
        font-size: 1rem;
        background: #fafcff;
      }

      .field input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(45,109,246,0.12);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 12px 0 22px;
        font-size: 0.9rem;
      }

      .check {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }

      .check input {
        width: 16px;
        height: 16px;
      }

      .divider {
        position: relative;
        text-align: center;
        margin: 22px 0 18px;
      }

      .divider::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 1px;
        background: #dfe5ef;
      }

      .divider span {
        position: relative;
        background: white;
        padding: 0 15px;
        font-size: 0.82rem;
        color: var(--muted);
      }

      .socials {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .social-button {
        height: 48px;
        border: 1px solid #dfe5ef;
        background: #f8fafc;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        color: #20314b;
      }

      .signup-copy {
        text-align: center;
        margin-top: 22px;
        color: var(--muted);
      }

      .signup-copy a {
        color: var(--primary);
        font-weight: 600;
      }

      .mascot-panel {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .mascot-card {
        width: 100%;
        max-width: 560px;
        min-height: 560px;
        border-radius: 30px;
        background: transparent;
        border: none;
        box-shadow: none;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .bobby-image {
        display: block;
        width: 100%;
        max-width: 540px;
        height: auto;
        object-fit: contain;
        background: transparent;
      }

      .hidden {
        display: none !important;
      }

      .dashboard {
        display: none;
      }

      .dashboard.show {
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 22px;
      }

      @media (max-width: 980px) {
        .login-panel, .dashboard {
          grid-template-columns: 1fr;
        }

        .topnav {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">Q</div>
          <span>Qulox Business</span>
        </div>
        <nav class="topnav">
          <a href="#">Home</a>
          <a href="#">Feed</a>
          <a href="#">Businesses</a>
        </nav>
        <button class="primary-button" onclick="toggleLogin()">Sign in</button>
      </header>

      <main class="app">
        <section class="login-panel" id="loginPanel">
          <div class="login-card">
            <div class="logo-circle">Q</div>
            <h1>Welcome back</h1>
            <p>Sign in to your business account</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
              <label class="field">
                <span>Email address</span>
                <input type="email" id="email" placeholder="you@company.com" required />
              </label>

              <label class="field">
                <span>Password</span>
                <input type="password" id="password" placeholder="••••••••" required />
              </label>

              <div class="row">
                <label class="check">
                  <input type="checkbox" />
                  <span>Remember me</span>
                </label>
                <a href="#">Forgot password?</a>
              </div>

              <button type="submit" class="primary-button wide">Sign in</button>
            </form>

            <div class="divider"><span>or continue with</span></div>

            <div class="socials">
              <button type="button" class="social-button">Google</button>
              <button type="button" class="social-button">GitHub</button>
            </div>

            <p class="signup-copy">
              Need an account? <a href="#">Create one</a>
            </p>
          </div>

          <div class="mascot-panel">
            <div class="mascot-card">
              <img src="BobbyBobertson.png" alt="Bobby Robertson mascot" class="bobby-image" />
            </div>
          </div>
        </section>

        <section class="dashboard" id="dashboard">
          <aside style="background: rgba(255,255,255,0.92); border-radius: 24px; padding: 20px;">
            <h3 style="margin: 0 0 20px; color: var(--primary);">Dashboard</h3>
            <nav style="display: flex; flex-direction: column; gap: 8px;">
              <a href="#" style="padding: 12px 14px; border-radius: 12px; color: #33415c; font-weight: 600;">📰 Feed</a>
              <a href="#" style="padding: 12px 14px; border-radius: 12px; color: #33415c; font-weight: 600;">✏️ Create Post</a>
              <a href="#" style="padding: 12px 14px; border-radius: 12px; color: #33415c; font-weight: 600;">👤 Profile</a>
            </nav>
          </aside>

          <div style="background: rgba(255,255,255,0.92); border-radius: 24px; padding: 26px;">
            <h2 style="margin: 0 0 20px; color: var(--text);">Welcome to Qulox Business!</h2>
            <p style="color: var(--muted);">Connect, share, and grow your business network.</p>
            <button class="primary-button" onclick="toggleLogin()">Sign Out</button>
          </div>
        </section>
      </main>
    </div>

    <script>
      function handleLogin(event) {
        event.preventDefault();
        const email = document.getElementById('email').value;
        if (email) {
          document.getElementById('loginPanel').classList.add('hidden');
          document.getElementById('dashboard').classList.add('show');
        }
      }

      function toggleLogin() {
        document.getElementById('loginPanel').classList.toggle('hidden');
        document.getElementById('dashboard').classList.toggle('show');
      }
    </script>
  </body>
</html>
